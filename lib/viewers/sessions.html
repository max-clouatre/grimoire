<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title></title>
<link rel="stylesheet" href="/grimoire/grimoire.css">
<style>
  body { padding: 0; height: 100vh; display: grid; grid-template-columns: 190px 1fr; }
  body.single { grid-template-columns: 1fr; }
  body.single .days { display: none; }
  .days { border-right: 1px solid var(--border); background: var(--surface); overflow-y: auto; padding: 16px 8px; }
  .days h1 { font-size: 18px; margin: 0 8px 2px; }
  .days .sub { margin: 0 8px 12px; font-size: 12px; }
  .day { display: flex; width: 100%; align-items: baseline; gap: 6px; padding: 6px 8px; border: 0; background: none; color: var(--foreground); font: inherit; font-size: 14px; border-radius: calc(var(--radius) * 0.7); cursor: pointer; text-align: left; }
  .day:hover { background: var(--hover); }
  .day.on { background: var(--accent-soft); font-weight: 600; }
  .day .n { margin-left: auto; font-size: 11px; color: var(--muted-foreground); font-family: var(--font-mono); }
  .live { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--green); margin-left: 4px; animation: pulse 2s infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  main { overflow-y: auto; padding: 20px 26px 0; display: flex; flex-direction: column; min-width: 0; }
  .head h2 { margin: 0; font-size: 20px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0 4px; align-items: center; }
  .chips label { margin-left: auto; font-size: 12px; color: var(--muted-foreground); display: flex; gap: 6px; align-items: center; cursor: pointer; }
  .timeline { list-style: none; padding: 0; margin: 10px 0 0; position: relative; flex: 1; }
  .timeline::before { content: ""; position: absolute; left: 61px; top: 4px; bottom: 0; width: 2px; background: var(--border); }
  .entry { display: grid; grid-template-columns: 46px 32px 1fr; gap: 0 4px; padding: 6px 0; align-items: start; }
  .entry .time { font-family: var(--font-mono); font-size: 12px; color: var(--muted-foreground); padding-top: 3px; text-align: right; padding-right: 4px; }
  .entry .dot { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; position: relative; z-index: 1; background: var(--muted); color: var(--muted-foreground); border: 2px solid var(--background); text-shadow: none; }
  .entry .body { min-width: 0; padding-top: 2px; }
  .entry .text { font-size: 14.5px; }
  .entry .who { font-size: 12px; color: var(--muted-foreground); margin-left: 6px; }
  .entry .files { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
  .entry .files code { font-size: 11px; }
  .entry.change .text { color: var(--muted-foreground); font-size: 13px; }
  .entry.new { animation: flash 1.4s ease; }
  @keyframes flash { from { background: var(--accent-soft); } }
  .k-start .dot { background: var(--blue-soft); color: var(--blue); }
  .k-decision .dot { background: var(--purple-soft); color: var(--purple); }
  .k-finding .dot { background: var(--teal-soft); color: var(--teal); }
  .k-question .dot { background: var(--yellow-soft); color: var(--yellow); }
  .k-blocker .dot { background: var(--red-soft); color: var(--red); }
  .k-done .dot { background: var(--green-soft); color: var(--green); }
  .k-summary .dot { background: var(--accent); color: var(--background); }
  .k-summary .text { font-weight: 600; }
  .compose { position: sticky; bottom: 0; background: var(--page); padding: 10px 0 16px; border-top: 1px solid var(--border); margin-top: 10px; display: flex; gap: 6px; }
  .compose select { font: inherit; font-size: 13px; color: var(--foreground); background: var(--background); border: 1px solid var(--border); border-radius: var(--radius); padding: 0 8px; }
  .compose input { flex: 1; }
  .empty { color: var(--muted-foreground); padding: 30px 0; text-align: center; }
  @media (max-width: 560px) { body { grid-template-columns: 1fr; } .days { display: none; } }
</style>
</head>
<body>
<nav class="days"><h1>Sessions</h1><p class="sub">One log per day, written as work happens</p><div id="days"></div></nav>
<main>
  <div class="head"><h2 id="title"></h2><div class="chips" id="chips"></div></div>
  <ul class="timeline" id="timeline"></ul>
  <form class="compose" id="compose" hidden>
    <select id="kind"><option>note</option><option>decision</option><option>question</option><option>blocker</option><option>finding</option><option>done</option></select>
    <input type="text" id="text" placeholder="Add to today's log…" autocomplete="off">
    <button class="btn primary">Add</button>
  </form>
</main>

<script>
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ICON = { start: "▶", note: "•", change: "✎", decision: "◆", finding: "★", question: "?", blocker: "!", done: "✓", summary: "≡", end: "■" };
const single = document.querySelector('meta[name="grimoire-mode"]')?.content === "session";
const pad = n => String(n).padStart(2, "0");
const todayName = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}.session.jsonl`; };
let days = [], current = null, entries = [], seen = 0, showChanges = true;

const parse = text => text.split(/\r?\n/).filter(Boolean).map(l => { try { return JSON.parse(l); } catch { return null; } }).filter(Boolean);
const label = name => {
  const iso = name.slice(0, 10), d = new Date(iso + "T12:00:00");
  const diff = Math.round((new Date(todayName().slice(0, 10) + "T12:00:00") - d) / 864e5);
  const pretty = d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
  return diff === 0 ? `Today · ${pretty}` : diff === 1 ? `Yesterday · ${pretty}` : pretty;
};
const readDay = async name => { try { return parse(await (single ? grim.read() : grim.read(name))); } catch { return []; } };

async function loadDays() {
  if (single) { days = [null]; current = null; return; }
  const list = (await grim.list()).filter(e => !e.dir && e.name.endsWith(".session.jsonl")).map(e => e.name).sort().reverse();
  if (!list.includes(todayName())) list.unshift(todayName());
  days = list;
  if (!current || !days.includes(current)) current = days[0];
  const counts = await Promise.all(days.slice(0, 30).map(async d => (await readDay(d)).length));
  document.getElementById("days").innerHTML = days.slice(0, 30).map((d, i) =>
    `<button class="day${d === current ? " on" : ""}" data-day="${esc(d)}">${esc(label(d))}${d === todayName() ? '<span class="live" title="Live"></span>' : ""}<span class="n">${counts[i] || ""}</span></button>`).join("");
}

async function loadEntries(animate) {
  const before = entries.length;
  entries = await readDay(current);
  const shown = entries.filter(e => showChanges || e.kind !== "change");
  const files = new Set(entries.flatMap(e => e.kind === "change" ? e.files || [] : []));
  const count = k => entries.filter(e => e.kind === k).length;
  document.getElementById("title").textContent = single ? document.title : label(current);
  document.getElementById("chips").innerHTML = [
    `<span class="tag">${entries.length} entries</span>`,
    files.size ? `<span class="tag">${files.size} files touched</span>` : "",
    count("decision") ? `<span class="tag purple">${count("decision")} decisions</span>` : "",
    count("question") ? `<span class="tag yellow">${count("question")} questions</span>` : "",
    count("blocker") ? `<span class="tag red">${count("blocker")} blockers</span>` : "",
    count("done") ? `<span class="tag green">${count("done")} done</span>` : "",
    `<label><input type="checkbox" id="show-changes"${showChanges ? " checked" : ""}> file edits</label>`,
  ].join("");
  const main = document.querySelector("main");
  const atBottom = main.scrollHeight - main.scrollTop - main.clientHeight < 80;
  document.getElementById("timeline").innerHTML = shown.length ? shown.map((e, i) => {
    const t = new Date(e.t), isNew = animate && entries.indexOf(e) >= before;
    const files = e.files || [];
    const text = e.kind === "change" ? `Edited ${files.length} file${files.length === 1 ? "" : "s"}` : esc(e.text);
    return `<li class="entry k-${esc(e.kind)}${e.kind === "change" ? " change" : ""}${isNew ? " new" : ""}">
      <span class="time" title="${esc(t.toLocaleString())}">${pad(t.getHours())}:${pad(t.getMinutes())}</span>
      <span class="dot" title="${esc(e.kind)}">${ICON[e.kind] || "•"}</span>
      <div class="body"><span class="text">${text}</span><span class="who">${esc(e.kind)} · ${esc(e.by || "")}</span>
        ${(e.refs || []).map(r => `<span class="tag blue" style="margin-left:4px">${esc(r)}</span>`).join("")}
        ${files.length ? `<div class="files">${files.slice(0, 8).map(f => `<code title="${esc(f)}">${esc(f.split("/").pop())}</code>`).join("")}${files.length > 8 ? `<span class="muted">+${files.length - 8}</span>` : ""}</div>` : ""}</div>
    </li>`;
  }).join("") : `<li class="empty">Nothing logged ${current === todayName() ? "yet today" : "this day"}.</li>`;
  document.getElementById("compose").hidden = !(single || current === todayName());
  if (animate && atBottom) main.scrollTop = main.scrollHeight;
}

document.addEventListener("click", async e => {
  const d = e.target.closest("[data-day]");
  if (d) { current = d.dataset.day; await loadDays(); await loadEntries(false); }
});
document.addEventListener("change", e => { if (e.target.id === "show-changes") { showChanges = e.target.checked; loadEntries(false); } });
document.getElementById("compose").addEventListener("submit", async e => {
  e.preventDefault();
  const input = document.getElementById("text"), text = input.value.trim();
  if (!text) return;
  const line = JSON.stringify({ t: new Date().toISOString(), by: "you", kind: document.getElementById("kind").value, text }) + "\n";
  const name = single ? "" : current;
  let existing = "";
  try { existing = await (single ? grim.read() : grim.read(name)); } catch {}
  if (existing && !existing.endsWith("\n")) existing += "\n";
  await (single ? grim.write(existing + line) : grim.write(name, existing + line));
  input.value = "";
});

// Agents and hooks append to the log on disk; re-read it in place.
grim.onChange(async ({ self }) => { if (self) { await loadDays(); await loadEntries(true); } });
if (single) document.body.classList.add("single");
(async () => { await loadDays(); await loadEntries(false); const m = document.querySelector("main"); m.scrollTop = m.scrollHeight; })();
</script>
</body>
</html>
